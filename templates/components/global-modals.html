<!-- 全局模态框和弹窗组件 -->

<!-- 通用确认对话框 -->
<div id="confirm-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="confirm-modal-title">确认操作</h3>
            <button type="button" class="modal-close" onclick="window.ComponentManager && window.ComponentManager.getComponent('modal') && window.ComponentManager.getComponent('modal').hide('confirm-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <p id="confirm-modal-message">确定要执行此操作吗？</p>
        </div>
        <div class="modal-footer">
            <button type="button" id="confirm-modal-cancel" class="btn-secondary" onclick="window.ComponentManager && window.ComponentManager.getComponent('modal') && window.ComponentManager.getComponent('modal').hide('confirm-modal')">取消</button>
            <button type="button" id="confirm-modal-confirm" class="btn-primary">确定</button>
        </div>
    </div>
</div>

<!-- 通用消息提示框 -->
<div id="message-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="message-modal-title">提示</h3>
            <button type="button" class="modal-close" onclick="window.ComponentManager && window.ComponentManager.getComponent('modal') && window.ComponentManager.getComponent('modal').hide('message-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <p id="message-modal-message">操作完成</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-primary" onclick="window.ComponentManager && window.ComponentManager.getComponent('modal') && window.ComponentManager.getComponent('modal').hide('message-modal')">确定</button>
        </div>
    </div>
</div>

<!-- 通用表单模态框 -->
<div id="form-modal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="form-modal-title">表单</h3>
            <button type="button" class="modal-close" onclick="window.ComponentManager && window.ComponentManager.getComponent('modal') && window.ComponentManager.getComponent('modal').hide('form-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <form id="form-modal-form">
                <div id="form-modal-fields">
                    <!-- 动态生成的表单字段 -->
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn-secondary" onclick="window.ComponentManager && window.ComponentManager.getComponent('modal') && window.ComponentManager.getComponent('modal').hide('form-modal')">取消</button>
            <button type="button" id="form-modal-submit" class="btn-primary">提交</button>
        </div>
    </div>
</div>

<!-- 通用加载提示框 -->
<div id="loading-modal" class="modal loading-modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-body">
            <div class="loading-spinner"></div>
            <p id="loading-modal-message">正在处理，请稍候...</p>
        </div>
    </div>
</div>

<!-- 模态框背景遮罩 -->
<div id="modal-overlay" class="modal-overlay" style="display: none;" onclick="window.ComponentManager && window.ComponentManager.getComponent('modal') && window.ComponentManager.getComponent('modal').hideAll()"></div>
