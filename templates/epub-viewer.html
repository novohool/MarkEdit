{% extends 'base-epub.html' %}

{% block title %}EPUB 阅读器 - MarkEdit{% endblock %}

{% block head_scripts %}
{{ super() }}
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
{% endblock %}

{% block additional_css %}
<link rel="stylesheet" href="/static/{{ theme }}/css/epub-viewer.css">
{% endblock %}



{% block main_content %}
<div class="epub-reader-container">
    <!-- 阅读器工具栏 -->
    <div class="reader-toolbar">
        <div class="toolbar-left">
            <select id="toc" class="toc-selector" title="章节目录">
                <option value="">选择章节...</option>
            </select>
        </div>
        <div class="toolbar-center">
            <div class="reading-progress">
                <div class="progress-bar" title="点击或拖拽跳转到指定位置">
                    <div class="progress-fill" id="reading-progress"></div>
                    <div class="progress-slider" id="progress-slider"></div>
                </div>
                <span class="progress-text" id="progress-text">0%</span>
            </div>
        </div>
        <div class="toolbar-right">
            <button id="font-size-decrease" class="btn-icon-only" title="减小字体">A-</button>
            <button id="font-size-increase" class="btn-icon-only" title="增大字体">A+</button>
        </div>
    </div>
    
    <!-- 阅读器主体 -->
    <div class="reader-main">
        <div id="viewer" class="epub-viewer"></div>
        <button id="prev" class="nav-arrow nav-prev" title="上一页">‹</button>
        <button id="next" class="nav-arrow nav-next" title="下一页">›</button>
    </div>
</div>
{% endblock %}

{% block page_scripts %}
<script src="/static/{{ theme }}/js/epub-viewer.js"></script>
{% endblock %}
