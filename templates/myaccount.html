<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的账户</title>
    <link rel="stylesheet" href="/static/{{ theme }}/css/style.css" id="theme-link">
    <link rel="stylesheet" href="/static/{{ theme }}/css/myaccount.css">
    <!-- 统一组件样式 -->
    <link rel="stylesheet" href="/static/common/css/unified-components.css">
    <link rel="stylesheet" href="/static/{{ theme }}/css/enhanced-ui-components.css">
    <link rel="stylesheet" href="/static/{{ theme }}/css/integrated-components.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-left">
                <h1><a href="/" style="text-decoration: none; color: inherit;">我的账户</a></h1>
            </div>
            <div class="header-right">
                <select id="theme-selector" class="btn-secondary">
                    <option value="default">默认主题</option>
                    <option value="wooden">木质主题</option>
                </select>
                <button id="back-btn" class="btn-secondary" onclick="window.history.back()">返回</button>
                <button id="logout-btn" class="btn-secondary" onclick="handleLogout()">登出</button>
            </div>
        </header>
        
        <div class="account-container">
            <!-- 用户信息卡片 -->
            <div class="info-card">
                <div class="card-header">
                    <div class="user-avatar">
                        <i class="avatar-icon">👤</i>
                    </div>
                    <div class="user-basic-info">
                        <h2 class="user-name" id="username" data-bind="user.username || '加载中...'">加载中...</h2>
                        <p class="user-role-badge" id="user-role" data-bind="user.primaryRole || '用户'">用户</p>
                    </div>
                </div>
                
                <div class="card-body">
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">
                                <i class="info-icon">📅</i>
                                注册时间
                            </div>
                            <div class="info-value" id="created-at" data-bind="user.createdAt || '-'">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">
                                <i class="info-icon">🕒</i>
                                最后登录
                            </div>
                            <div class="info-value" id="login-time" data-bind="user.lastLogin || '-'">-</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">
                                <i class="info-icon">🎨</i>
                                当前主题
                            </div>
                            <div class="info-value" id="current-theme" data-bind="user.currentTheme || '-'">-</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 设置面板 -->
            <div class="settings-panel">
                <!-- 主题设置 -->
                <div class="setting-card">
                    <div class="setting-header">
                        <h3>
                            <i class="setting-icon">🎨</i>
                            主题设置
                        </h3>
                        <p class="setting-desc">选择您喜欢的界面主题</p>
                    </div>
                    <div class="setting-body">
                        <div class="theme-options">
                            <div class="theme-option" data-theme="default">
                                <div class="theme-preview default-preview">
                                    <div class="preview-header"></div>
                                    <div class="preview-content"></div>
                                </div>
                                <div class="theme-info">
                                    <h4>默认主题</h4>
                                    <p>简洁现代的设计风格</p>
                                </div>
                                <input type="radio" name="theme" value="default" id="theme-default">
                            </div>
                            <div class="theme-option" data-theme="wooden">
                                <div class="theme-preview wooden-preview">
                                    <div class="preview-header"></div>
                                    <div class="preview-content"></div>
                                </div>
                                <div class="theme-info">
                                    <h4>木质主题</h4>
                                    <p>温暖自然的木质风格</p>
                                </div>
                                <input type="radio" name="theme" value="wooden" id="theme-wooden">
                            </div>
                        </div>
                        <button type="button" id="save-theme-btn" class="btn-primary">
                            <i class="btn-icon">💾</i>
                            保存主题设置
                        </button>
                    </div>
                </div>
                
                <!-- LLM配置 -->
                <div class="setting-card">
                    <div class="setting-header">
                        <h3>
                            <i class="setting-icon">🤖</i>
                            LLM 配置
                        </h3>
                        <p class="setting-desc">配置您的AI助手参数</p>
                    </div>
                    <div class="setting-body">
                        <div class="form-group">
                            <label for="llm-config" class="form-label">
                                配置参数 (JSON格式)
                            </label>
                            <textarea id="llm-config" class="config-textarea" 
                                      placeholder='{"model": "gpt-4", "api_key": "your-api-key", "temperature": 0.7}'></textarea>
                            <div class="form-help">
                                <i class="help-icon">💡</i>
                                支持配置模型、API密钥、温度等参数
                            </div>
                        </div>
                        <div class="btn-group">
                            <button type="button" id="save-llm-config-btn" class="btn-primary">
                                <i class="btn-icon">💾</i>
                                保存配置
                            </button>
                            <button type="button" id="reset-llm-config-btn" class="btn-secondary">
                                <i class="btn-icon">🔄</i>
                                重置
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- 活动记录 -->
                <div class="setting-card">
                    <div class="setting-header">
                        <h3>
                            <i class="setting-icon">📊</i>
                            最近活动
                        </h3>
                        <p class="setting-desc">查看您的操作记录</p>
                    </div>
                    <div class="setting-body">
                        <div id="recent-activities" class="activity-list">
                            <div class="activity-item loading">
                                <div class="activity-icon">⏳</div>
                                <div class="activity-content">
                                    <div class="activity-title">正在加载活动记录...</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入公共JavaScript函数库 -->
    <script src="/static/common/js/common.js"></script>
    <script src="/static/common/js/enhanced-component-manager.js"></script>
    <script src="/static/{{ theme }}/js/admin.js"></script>
    <script src="/static/{{ theme }}/js/myaccount.js"></script>
</body>
</html>
